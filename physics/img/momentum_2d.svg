<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="640" height="370" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker></defs><line x1="40" y1="160" x2="250" y2="160" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><circle cx="250" cy="160" r="20" fill="#d6eaf8" stroke="#222" stroke-width="2"/><line x1="140" y1="160" x2="225" y2="160" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="60" y="128" fill="#2471a3" font-size="14">p<tspan dy="4" font-size="10">before</tspan></text><circle cx="330" cy="160" r="20" fill="#fdebd0" stroke="#222" stroke-width="2"/><text x="330" y="165" fill="#222" text-anchor="middle" font-size="10">rest</text><line x1="360" y1="160" x2="460" y2="100" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="468" y="98" fill="#2471a3" font-size="14">p<tspan dy="4" font-size="10">1</tspan></text><line x1="360" y1="160" x2="450" y2="230" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="458" y="236" fill="#2471a3" font-size="14">p<tspan dy="4" font-size="10">2</tspan></text><path d="M400 160A40 40 0 0 0 395 145" fill="none" stroke="#222" stroke-width="1.5"/><text x="404" y="146" fill="#222" font-size="12">θ<tspan dy="4" font-size="8">1</tspan></text><path d="M400 160A40 40 0 0 1 398 183" fill="none" stroke="#222" stroke-width="1.5"/><text x="404" y="196" fill="#222" font-size="12">θ<tspan dy="4" font-size="8">2</tspan></text><line x1="130" y1="290" x2="290" y2="290" stroke="#222" stroke-width="3" marker-end="url(#k)"/><text x="140" y="314" fill="#222" font-size="12">p<tspan dy="4" font-size="8">before</tspan></text><line x1="130" y1="290" x2="230" y2="230" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="178" y="248" fill="#2471a3" font-size="12">p<tspan dy="4" font-size="8">1</tspan></text><line x1="230" y1="230" x2="290" y2="290" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="276" y="254" fill="#2471a3" font-size="12">p<tspan dy="4" font-size="8">2</tspan></text><text x="330" y="282" fill="#222" font-size="12" font-weight="bold">Momentum is a vector, so it is conserved</text><text x="330" y="302" fill="#222" font-size="12" font-weight="bold">in each direction separately:</text><text x="330" y="324" fill="#222" font-size="12">horizontal:  p = p<tspan dy="4" font-size="8">1</tspan><tspan dy="-4">cos θ</tspan><tspan dy="4" font-size="8">1</tspan><tspan dy="-4"> + p</tspan><tspan dy="4" font-size="8">2</tspan><tspan dy="-4">cos θ</tspan><tspan dy="4" font-size="8">2</tspan></text><text x="330" y="344" fill="#222" font-size="12">vertical:  0 = p<tspan dy="4" font-size="8">1</tspan><tspan dy="-4">sin θ</tspan><tspan dy="4" font-size="8">1</tspan><tspan dy="-4"> − p</tspan><tspan dy="4" font-size="8">2</tspan><tspan dy="-4">sin θ</tspan><tspan dy="4" font-size="8">2</tspan></text><text x="330" y="60" fill="#777" font-size="11">The vectors must close into a triangle</text></svg>