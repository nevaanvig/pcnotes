<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="780" height="300" fill="#fff"/><defs></defs><circle cx="75" cy="130" r="45" fill="none" stroke="#222" stroke-width="3"/><line x1="75" y1="60" x2="75" y2="205" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="75" y="220" fill="#222" text-anchor="middle" font-size="11" font-weight="bold">Hoop / thin ring</text><text x="75" y="246" fill="#2471a3" text-anchor="middle" font-size="13">I = MR²</text><circle cx="203" cy="130" r="45" fill="#d6eaf8" stroke="#222" stroke-width="2"/><line x1="203" y1="60" x2="203" y2="205" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="203" y="220" fill="#222" text-anchor="middle" font-size="11" font-weight="bold">Solid disc / cylinder</text><text x="203" y="246" fill="#2471a3" text-anchor="middle" font-size="13">I = MR²/2</text><rect x="281" y="122" width="100" height="14" fill="#eee" stroke="#222" stroke-width="2"/><line x1="331" y1="70" x2="331" y2="195" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="331" y="220" fill="#222" text-anchor="middle" font-size="11" font-weight="bold">Rod about centre</text><text x="331" y="246" fill="#2471a3" text-anchor="middle" font-size="13">I = ML²/12</text><rect x="409" y="122" width="100" height="14" fill="#eee" stroke="#222" stroke-width="2"/><line x1="409" y1="70" x2="409" y2="195" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="459" y="220" fill="#222" text-anchor="middle" font-size="11" font-weight="bold">Rod about end</text><text x="459" y="246" fill="#2471a3" text-anchor="middle" font-size="13">I = ML²/3</text><circle cx="587" cy="130" r="45" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="587" y1="60" x2="587" y2="205" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="587" y="220" fill="#222" text-anchor="middle" font-size="11" font-weight="bold">Solid sphere</text><text x="587" y="246" fill="#2471a3" text-anchor="middle" font-size="13">I = 2MR²/5</text><circle cx="715" cy="130" r="45" fill="none" stroke="#222" stroke-width="3"/><circle cx="715" cy="130" r="38" fill="none" stroke="#777" stroke-width="1"/><line x1="715" y1="60" x2="715" y2="205" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="715" y="220" fill="#222" text-anchor="middle" font-size="11" font-weight="bold">Hollow sphere</text><text x="715" y="246" fill="#2471a3" text-anchor="middle" font-size="13">I = 2MR²/3</text><text x="390" y="282" fill="#777" text-anchor="middle" font-size="12">Dashed line = rotation axis.  Mass further from the axis → larger I → harder to angularly accelerate.</text></svg>