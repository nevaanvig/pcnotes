<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="760" height="340" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><polygon points="80,95 200,95 200,240 80,240" fill="#aed6f1" opacity="1.0"/><polygon points="200,95 480,109 480,167 200,153" fill="#a9dfbf" opacity="1.0"/><polygon points="200,153 480,223 480,310 200,240" fill="#f5b7b1" opacity="1.0"/><text x="84" y="83" fill="#2471a3" font-size="12.5" font-weight="bold">energy input  1000 J</text><text x="492" y="142" fill="#1e8449" font-size="12.5" font-weight="bold">useful output  400 J</text><text x="492" y="285" fill="#c0392b" font-size="12.5" font-weight="bold">wasted as heat and sound  600 J</text><text x="60" y="52" fill="#222" font-size="15" font-weight="bold">Sankey diagram — arrow width is proportional to energy</text><text x="60" y="302" fill="#222" font-size="14" font-weight="bold">efficiency  η  =  useful output ÷ total input  =  400 / 1000  =  0.40  =  40%</text><text x="60" y="326" fill="#777" font-size="12">Efficiency has no units and can never exceed 1. The widths in and out must match.</text></svg>