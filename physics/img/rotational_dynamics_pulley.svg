<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="660" height="380" fill="#fff"/><defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><line x1="150" y1="20" x2="330" y2="20" stroke="#222" stroke-width="3"/><line x1="240" y1="20" x2="240" y2="70" stroke="#222" stroke-width="1.5"/><circle cx="240" cy="140" r="70" fill="#eee" stroke="#222" stroke-width="2"/><circle cx="240" cy="140" r="5" fill="#222"/><path d="M290 100A70 70 0 0 0 190 100" fill="none" stroke="#d68910" stroke-width="2.5" marker-end="url(#o)"/><text x="240" y="88" fill="#d68910" text-anchor="middle" font-size="14" font-weight="bold">α</text><line x1="240" y1="70" x2="240" y2="140" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><line x1="240" y1="140" x2="310" y2="140" stroke="#777" stroke-width="1.5" marker-end="url(#gr)"/><text x="268" y="132" fill="#777" font-size="14">R</text><line x1="310" y1="140" x2="310" y2="250" stroke="#222" stroke-width="2"/><rect x="280" y="250" width="60" height="50" fill="#d6eaf8" stroke="#222" stroke-width="2"/><text x="310" y="280" fill="#222" text-anchor="middle" font-size="14">m</text><line x1="310" y1="250" x2="310" y2="185" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/><text x="318" y="210" fill="#c0392b" font-size="14" font-weight="bold">T</text><line x1="310" y1="300" x2="310" y2="360" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/><text x="318" y="350" fill="#c0392b" font-size="14" font-weight="bold">mg</text><line x1="380" y1="250" x2="380" y2="310" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="388" y="284" fill="#2471a3" font-size="14" font-weight="bold">a</text><text x="420" y="120" fill="#222" font-size="13" font-weight="bold">Pulley (rotation):</text><text x="420" y="142" fill="#222" font-size="13">Στ = TR = Iα</text><text x="420" y="178" fill="#222" font-size="13" font-weight="bold">Mass (translation):</text><text x="420" y="200" fill="#222" font-size="13">mg − T = ma</text><text x="420" y="236" fill="#222" font-size="13" font-weight="bold">Link (string does not slip):</text><text x="420" y="258" fill="#222" font-size="13">a = αR</text><text x="420" y="294" fill="#6c3483" font-size="13" font-weight="bold">a = g / (1 + I/mR²)</text><text x="420" y="316" fill="#777" font-size="11">T is less than mg whenever</text><text x="420" y="332" fill="#777" font-size="11">the pulley has to be spun up</text></svg>