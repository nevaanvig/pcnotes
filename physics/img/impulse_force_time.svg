-dasharray="6 4"/><line x1="80" y1="282" x2="340" y2="282" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><line x1="340" y1="282" x2="80" y2="282" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><text x="210" y="300" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">Δt</text><text x="190" y="215" fill="#222" text-anchor="middle" font-size="13" font-weight="bold">area = impulse = Δp</text><text x="390" y="110" fill="#222" font-size="13" font-weight="bold">J = FΔt = Δp = mv − mu</text><text x="390" y="140" fill="#777" font-size="11">Same Δp over a longer Δt</text><text x="390" y="156" fill="#777" font-size="11">means a smaller peak force —</text><text x="390" y="172" fill="#777" font-size="11">airbags, crumple zones,</text><text x="390" y="188" fill="#777" font-size="11">bending your knees on landing.</text></svg>