<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="660" height="360" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="60" y1="60" x2="200" y2="60" stroke="#222" stroke-width="4"/><polyline points="90,60 108,74 72,81 108,87 72,94 108,101 72,107 108,114 72,121 108,127 72,134 108,141 72,147 108,154 72,161 108,167 90,180" fill="none" stroke="#777" stroke-width="2"/><rect x="64" y="180" width="52" height="34" rx="0" fill="#fcf3cf" stroke="#222" stroke-width="2"/><text x="90" y="234" fill="#777" text-anchor="middle" font-size="11.5">natural length</text><polyline points="220,60 238,74 202,85 238,95 202,106 238,117 202,127 238,138 202,149 238,159 202,170 238,181 202,191 238,202 202,213 238,223 220,240" fill="none" stroke="#2471a3" stroke-width="2"/><rect x="194" y="240" width="52" height="34" rx="0" fill="#fcf3cf" stroke="#222" stroke-width="2"/><line x1="266" y1="60" x2="266" y2="240" stroke="#2471a3" stroke-width="1.6" marker-end="url(#b)"/><line x1="266" y1="240" x2="266" y2="60" stroke="#2471a3" stroke-width="1.6" marker-end="url(#b)"/><text x="274" y="150" fill="#2471a3" font-size="14" font-weight="bold">x</text><text x="220" y="294" fill="#777" text-anchor="middle" font-size="11.5">extension x</text><line x1="350" y1="265" x2="590" y2="265" stroke="#222" stroke-width="2" marker-end="url(#k)"/><line x1="350" y1="265" x2="350" y2="65" stroke="#222" stroke-width="2" marker-end="url(#k)"/><text x="590" y="285" fill="#777" text-anchor="end" font-size="12">extension x / m</text><text x="344" y="59" fill="#777" font-size="12">F / N</text><polygon points="350,265 540,110 540,265" fill="#dceaf6" opacity="1.0"/><line x1="350" y1="265" x2="555" y2="98" stroke="#2471a3" stroke-width="3"/><line x1="540" y1="110" x2="540" y2="265" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><text x="468" y="221" fill="#2471a3" text-anchor="middle" font-size="13" font-weight="bold">area = ½kx²</text><text x="468" y="239" fill="#777" text-anchor="middle" font-size="11">the elastic PE stored</text><text x="500" y="115" fill="#2471a3" font-size="12" font-weight="bold">gradient = k</text><text x="60" y="318" fill="#222" font-size="13" font-weight="bold">Hooke's law:  F = kx</text><text x="215" y="318" fill="#777" font-size="12.5">k is the spring constant, in N m<tspan dy="-6" font-size="8.5">-1</tspan></text><text x="60" y="342" fill="#222" font-size="12.5">Elastic PE:  E<tspan dy="4" font-size="8.5">e</tspan><tspan dy="-4"> = ½kx² = ½Fx — the ½ is there because the force grew from zero.</tspan></text></svg>