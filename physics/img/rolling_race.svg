<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="700" height="380" fill="#fff"/><defs></defs><path d="M60 300L640 300L640 92Z" fill="#eee" stroke="#222" stroke-width="2"/><circle cx="250" cy="204" r="26" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="250" cy="204" r="3" fill="#222"/><text x="250" y="168" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">Hoop</text><circle cx="390" cy="154" r="26" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="390" cy="154" r="3" fill="#222"/><text x="390" y="118" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">Disc</text><circle cx="530" cy="103" r="26" fill="#fdebd0" stroke="#222" stroke-width="2"/><circle cx="530" cy="103" r="3" fill="#222"/><text x="530" y="67" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">Sphere</text><path d="M120 300A50 50 0 0 0 113 276" fill="none" stroke="#222" stroke-width="1.5"/><text x="126" y="294" fill="#222" font-size="14">θ</text><text x="70" y="60" fill="#222" font-size="12" font-weight="bold">Hoop:</text><text x="145" y="60" fill="#2471a3" font-size="12">I = MR²</text><text x="265" y="60" fill="#6c3483" font-size="12">a = 0.50 g sin θ</text><text x="70" y="82" fill="#222" font-size="12" font-weight="bold">Disc:</text><text x="145" y="82" fill="#2471a3" font-size="12">I = MR²/2</text><text x="265" y="82" fill="#6c3483" font-size="12">a = 0.67 g sin θ</text><text x="70" y="104" fill="#222" font-size="12" font-weight="bold">Sphere:</text><text x="145" y="104" fill="#2471a3" font-size="12">I = 2MR²/5</text><text x="265" y="104" fill="#6c3483" font-size="12">a = 0.71 g sin θ</text><text x="60" y="348" fill="#6c3483" font-size="13" font-weight="bold">a = g sin θ / (1 + I/MR²)   —  independent of mass and radius</text><text x="60" y="370" fill="#777" font-size="12">Least I/MR² wins: sphere, then disc, then hoop. Starting from rest they finish in that order every time.</text></svg>