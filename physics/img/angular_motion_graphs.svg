<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="720" height="350" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs><line x1="70" y1="230" x2="255" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><line x1="70" y1="230" x2="70" y2="35" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><text x="258" y="248" fill="#222" text-anchor="end" font-size="12">t</text><polyline points="70,230 78,230 87,228 96,226 104,223 112,219 121,214 130,208 138,201 146,194 155,185 164,176 172,165 180,154 189,142 198,129 206,115 214,100 223,84 232,68 240,50" fill="none" stroke="#c0392b" stroke-width="3"/><text x="62" y="50" fill="#222" text-anchor="end" font-size="14">θ</text><line x1="172" y1="165" x2="240" y2="108" stroke="#777" stroke-width="1.5" stroke-dasharray="6 4"/><text x="115" y="195" fill="#777" font-size="12">gradient = ω</text><text x="155" y="282" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">angular displacement θ</text><text x="155" y="302" fill="#777" text-anchor="middle" font-size="11">gradient = ω</text><line x1="295" y1="230" x2="480" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><line x1="295" y1="230" x2="295" y2="35" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><text x="483" y="248" fill="#222" text-anchor="end" font-size="12">t</text><polygon points="295,230 465,50 465,230" fill="#d6eaf8"/><line x1="295" y1="230" x2="465" y2="50" stroke="#2471a3" stroke-width="3"/><text x="287" y="50" fill="#222" text-anchor="end" font-size="14">ω</text><text x="397" y="202" fill="#222" text-anchor="middle" font-size="12">area = Δθ</text><text x="380" y="282" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">angular velocity ω</text><text x="380" y="302" fill="#777" text-anchor="middle" font-size="11">gradient = α, area = Δθ</text><line x1="520" y1="230" x2="705" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><line x1="520" y1="230" x2="520" y2="35" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/><text x="708" y="248" fill="#222" text-anchor="end" font-size="12">t</text><rect x="520" y="140" width="170" height="90" fill="#fdebd0"/><line x1="520" y1="140" x2="690" y2="140" stroke="#d68910" stroke-width="3"/><text x="512" y="50" fill="#222" text-anchor="end" font-size="14">α</text><text x="605" y="190" fill="#222" text-anchor="middle" font-size="12">area = Δω</text><text x="605" y="282" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">angular acceleration α</text><text x="605" y="302" fill="#777" text-anchor="middle" font-size="11">area = Δω</text><text x="60" y="330" fill="#222" font-size="13" font-weight="bold">Constant α:  ω = ω<tspan dy="4" font-size="9">i</tspan><tspan dy="-4"> + αt   ·   θ = ω</tspan><tspan dy="4" font-size="9">i</tspan><tspan dy="-4">t + ½αt²   ·   ω² = ω</tspan><tspan dy="4" font-size="9">i</tspan><tspan dy="-4">² + 2αθ   ·   θ = ½(ω</tspan><tspan dy="4" font-size="9">i</tspan><tspan dy="-4"> + ω)t</tspan></text></svg>