<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="660" height="330" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="60" y1="210" x2="450" y2="210" stroke="#222" stroke-width="2.5"/><rect x="170" y="162" width="110" height="42" rx="0" fill="#d6eaf8" stroke="#222" stroke-width="2"/><rect x="196" y="146" width="56" height="18" rx="0" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="196" cy="210" r="11" fill="#eee" stroke="#222" stroke-width="2"/><circle cx="258" cy="210" r="11" fill="#eee" stroke="#222" stroke-width="2"/><line x1="282" y1="182" x2="370" y2="182" stroke="#1e8449" stroke-width="3" marker-end="url(#g)"/><text x="300" y="172" fill="#1e8449" font-size="12" font-weight="bold">driving force F</text><line x1="168" y1="182" x2="90" y2="182" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/><text x="150" y="172" fill="#c0392b" text-anchor="end" font-size="12" font-weight="bold">drag F</text><line x1="226" y1="124" x2="330" y2="124" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="338" y="128" fill="#2471a3" font-size="12.5" font-weight="bold">v (constant)</text><text x="60" y="52" fill="#222" font-size="19" font-weight="bold">P = W/t = Fs/t = F v</text><text x="60" y="78" fill="#777" font-size="12">At constant speed the driving force exactly matches the resistive force,</text><text x="60" y="96" fill="#777" font-size="12">so all the engine's useful power goes into fighting drag.</text><text x="60" y="262" fill="#222" font-size="12.5">Doubling the speed doubles P for the same F — but drag itself grows with v²,</text><text x="60" y="284" fill="#222" font-size="12.5">so the power needed climbs roughly as v³. That is why top speed is so expensive.</text><text x="60" y="312" fill="#222" font-size="12.5" font-weight="bold">Lifting at constant speed:  P = mgv.      Up a slope:  P = (mg sin θ + F)v.</text></svg>