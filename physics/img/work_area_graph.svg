<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 375" width="660" height="375" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="660" height="375" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="90" y1="275" x2="320" y2="275" stroke="#222" stroke-width="2" marker-end="url(#k)"/><line x1="90" y1="275" x2="90" y2="105" stroke="#222" stroke-width="2" marker-end="url(#k)"/><text x="320" y="295" fill="#777" text-anchor="end" font-size="12">displacement / m</text><text x="84" y="99" fill="#777" font-size="12">F / N</text><polygon points="90,275 90,155 290,155 290,275" fill="#dceaf6" opacity="1.0"/><line x1="90" y1="155" x2="290" y2="155" stroke="#2471a3" stroke-width="3"/><line x1="290" y1="155" x2="290" y2="275" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><text x="190" y="213" fill="#2471a3" text-anchor="middle" font-size="14" font-weight="bold">W = Fs</text><text x="190" y="311" fill="#777" text-anchor="middle" font-size="12">constant force</text><line x1="400" y1="275" x2="630" y2="275" stroke="#222" stroke-width="2" marker-end="url(#k)"/><line x1="400" y1="275" x2="400" y2="105" stroke="#222" stroke-width="2" marker-end="url(#k)"/><text x="630" y="295" fill="#777" text-anchor="end" font-size="12">extension / m</text><text x="394" y="99" fill="#777" font-size="12">F / N</text><polygon points="400,275 600,125 600,275" fill="#fbeccf" opacity="1.0"/><line x1="400" y1="275" x2="600" y2="125" stroke="#d68910" stroke-width="3"/><line x1="600" y1="125" x2="600" y2="275" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><text x="525" y="233" fill="#d68910" text-anchor="middle" font-size="14" font-weight="bold">W = ½Fx</text><text x="500" y="311" fill="#777" text-anchor="middle" font-size="12">force growing with x (a spring)</text><text x="60" y="50" fill="#222" font-size="16" font-weight="bold">Work done = AREA under the force–displacement graph</text><text x="60" y="74" fill="#777" font-size="12">True for any shape of graph, which is why it beats W = Fs cos θ when F varies.</text><text x="60" y="348" fill="#222" font-size="12">Area below the axis counts as NEGATIVE work — the force is taking energy out.</text></svg>