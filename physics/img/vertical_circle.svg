<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="700" height="450" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><circle cx="230" cy="200" r="135" fill="none" stroke="#777" stroke-width="1.8"/><circle cx="230" cy="65" r="8" fill="#2471a3"/><line x1="230" y1="65" x2="230" y2="117" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="238" y="113" fill="#c0392b" font-size="12" font-weight="bold">mg</text><line x1="214" y1="65" x2="214" y2="105" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="206" y="99" fill="#2471a3" text-anchor="end" font-size="12" font-weight="bold">N</text><text x="230" y="47" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">TOP:  N + mg = mv²/r</text><circle cx="365" cy="200" r="8" fill="#2471a3"/><line x1="365" y1="200" x2="365" y2="252" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="373" y="252" fill="#c0392b" font-size="12" font-weight="bold">mg</text><line x1="365" y1="200" x2="311" y2="200" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="307" y="192" fill="#2471a3" text-anchor="end" font-size="12" font-weight="bold">N</text><text x="359" y="266" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">SIDE: only N is centripetal</text><circle cx="230" cy="335" r="8" fill="#2471a3"/><line x1="230" y1="335" x2="230" y2="387" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="238" y="385" fill="#c0392b" font-size="12" font-weight="bold">mg</text><line x1="214" y1="335" x2="214" y2="269" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="206" y="275" fill="#2471a3" text-anchor="end" font-size="12" font-weight="bold">N</text><text x="230" y="409" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">BOTTOM:  N − mg = mv²/r</text><circle cx="230" cy="200" r="4" fill="#222"/><text x="470" y="146" fill="#222" font-size="13" font-weight="bold">v<tspan dy="4" font-size="9">min</tspan><tspan dy="-4"> at the top = √(gr)</tspan></text><text x="470" y="168" fill="#777" font-size="11">(set N = 0: gravity alone)</text><text x="470" y="232" fill="#222" font-size="13" font-weight="bold">v<tspan dy="4" font-size="9">b</tspan><tspan dy="-4">² = v</tspan><tspan dy="4" font-size="9">t</tspan><tspan dy="-4">² + 4gr</tspan></text><text x="470" y="268" fill="#6c3483" font-size="13" font-weight="bold">N<tspan dy="4" font-size="9">bottom</tspan><tspan dy="-4"> − N</tspan><tspan dy="4" font-size="9">top</tspan><tspan dy="-4"> = 6mg</tspan></text><text x="470" y="290" fill="#777" font-size="11">always, whatever v and r</text><text x="45" y="432" fill="#222" font-size="12">Gravity helps at the top and fights you at the bottom — which is why you feel heaviest at the bottom.</text></svg>