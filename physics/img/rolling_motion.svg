<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="700" height="330" fill="#fff"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker></defs><line x1="40" y1="250" x2="430" y2="250" stroke="#222" stroke-width="3"/><circle cx="230" cy="180" r="70" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="230" cy="180" r="5" fill="#222"/><line x1="230" y1="180" x2="300" y2="180" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="279" y2="229" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="230" y2="250" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="181" y2="229" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="160" y2="180" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="181" y2="131" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="230" y2="110" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="279" y2="131" stroke="#777" stroke-width="1"/><line x1="230" y1="180" x2="340" y2="180" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="348" y="185" fill="#2471a3" font-size="14" font-weight="bold">v = ωR</text><line x1="230" y1="110" x2="400" y2="110" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="408" y="115" fill="#2471a3" font-size="12">2v  (top moves fastest)</text><circle cx="230" cy="250" r="6" fill="#c0392b"/><text x="238" y="276" fill="#c0392b" font-size="12">v = 0 at the contact point</text><path d="M290 130A70 70 0 0 0 170 130" fill="none" stroke="#d68910" stroke-width="2.5" marker-end="url(#o)"/><text x="230" y="118" fill="#d68910" text-anchor="middle" font-size="14" font-weight="bold">ω</text><text x="470" y="180" fill="#222" font-size="13" font-weight="bold">Rolling without slipping:</text><text x="470" y="202" fill="#222" font-size="13">v = ωR,   a = αR,   s = Rθ</text><text x="470" y="232" fill="#6c3483" font-size="13" font-weight="bold">KE<tspan dy="4" font-size="9">total</tspan><tspan dy="-4"> = ½mv² + ½Iω²</tspan></text><text x="470" y="256" fill="#777" font-size="11">Static friction acts, but does no work,</text><text x="470" y="272" fill="#777" font-size="11">because the contact point is at rest.</text><text x="40" y="318" fill="#777" font-size="12">The contact point is the instantaneous axis of rotation: the wheel is momentarily turning about it.</text></svg>