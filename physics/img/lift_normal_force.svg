<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="680" height="370" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="60" y1="250" x2="640" y2="250" stroke="#222" stroke-width="2"/><line x1="60" y1="150" x2="640" y2="150" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/><text x="648" y="154" fill="#777" text-anchor="end" font-size="12">mg</text><rect x="90" y="150" width="62" height="100" rx="0" fill="#eee" stroke="#777" stroke-width="2"/><text x="121" y="140" fill="#777" text-anchor="middle" font-size="12" font-weight="bold">N = mg</text><text x="121" y="272" fill="#222" text-anchor="middle" font-size="11">at rest</text><text x="121" y="287" fill="#222" text-anchor="middle" font-size="11">or steady</text><text x="121" y="308" fill="#777" text-anchor="middle" font-size="11">a = 0</text><rect x="202" y="105" width="62" height="145" rx="0" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/><text x="233" y="95" fill="#c0392b" text-anchor="middle" font-size="12" font-weight="bold">N &gt; mg</text><text x="233" y="272" fill="#222" text-anchor="middle" font-size="11">accelerating</text><text x="233" y="287" fill="#222" text-anchor="middle" font-size="11">up</text><text x="233" y="308" fill="#777" text-anchor="middle" font-size="11">a &gt; 0</text><rect x="314" y="188" width="62" height="62" rx="0" fill="#d6eaf8" stroke="#2471a3" stroke-width="2"/><text x="345" y="178" fill="#2471a3" text-anchor="middle" font-size="12" font-weight="bold">N &lt; mg</text><text x="345" y="272" fill="#222" text-anchor="middle" font-size="11">decelerating</text><text x="345" y="287" fill="#222" text-anchor="middle" font-size="11">up</text><text x="345" y="308" fill="#777" text-anchor="middle" font-size="11">a &lt; 0</text><rect x="426" y="188" width="62" height="62" rx="0" fill="#d6eaf8" stroke="#2471a3" stroke-width="2"/><text x="457" y="178" fill="#2471a3" text-anchor="middle" font-size="12" font-weight="bold">N &lt; mg</text><text x="457" y="272" fill="#222" text-anchor="middle" font-size="11">accelerating</text><text x="457" y="287" fill="#222" text-anchor="middle" font-size="11">down</text><text x="457" y="308" fill="#777" text-anchor="middle" font-size="11">a &lt; 0</text><rect x="538" y="246" width="62" height="4" rx="0" fill="#eee" stroke="#222" stroke-width="2"/><text x="569" y="236" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">N = 0</text><text x="569" y="272" fill="#222" text-anchor="middle" font-size="11">free fall</text><text x="569" y="308" fill="#777" text-anchor="middle" font-size="11">a = −g</text><text x="45" y="336" fill="#222" font-size="12">You never feel your weight — you feel the floor. N = m(g + a), so only the ACCELERATION matters,</text><text x="45" y="358" fill="#222" font-size="12">not which way the lift is travelling.</text></svg>