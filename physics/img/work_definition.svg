<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="640" height="330" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="60" y1="216" x2="580" y2="216" stroke="#222" stroke-width="2.5"/><rect x="80" y="156" width="80" height="60" rx="0" fill="#fcf3cf" stroke="#222" stroke-width="2"/><rect x="340" y="156" width="80" height="60" rx="0" fill="#f4f6f6" stroke="#222" stroke-width="2"/><line x1="120" y1="190" x2="247" y2="111" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/><text x="254" y="105" fill="#c0392b" font-size="15" font-weight="bold">F</text><line x1="120" y1="190" x2="290" y2="190" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><path d="M178 190A58 58 0 0 0 169 159" fill="none" stroke="#222" stroke-width="1.5"/><text x="186" y="174" fill="#222" font-size="14" font-weight="bold">θ</text><line x1="120" y1="190" x2="247" y2="190" stroke="#1e8449" stroke-width="2.2" marker-end="url(#g)"/><text x="195" y="208" fill="#1e8449" font-size="12" font-weight="bold">F cos θ</text><line x1="120" y1="246" x2="380" y2="246" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><line x1="380" y1="246" x2="120" y2="246" stroke="#2471a3" stroke-width="2.5" marker-end="url(#b)"/><text x="250" y="266" fill="#2471a3" text-anchor="middle" font-size="15" font-weight="bold">s</text><text x="60" y="52" fill="#222" font-size="19" font-weight="bold">W = F s cos θ</text><text x="60" y="78" fill="#777" font-size="12">Only the component of the force ALONG the displacement does work.</text><text x="60" y="285" fill="#222" font-size="12.5">θ = 0°  →  W = Fs (maximum)        θ = 90°  →  W = 0 (no work at all)</text><text x="60" y="308" fill="#777" font-size="12">This is why carrying a bag horizontally does no work on it, and why the normal</text><text x="60" y="326" fill="#777" font-size="12">force and the centripetal force never do work.</text></svg>