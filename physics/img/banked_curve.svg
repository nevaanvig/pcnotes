<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="640" height="350" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><polygon points="80,260 470,260 470,165" fill="#eaf2f8" opacity="1.0"/><polyline points="80,260 470,260 470,165 80,260" fill="none" stroke="#222" stroke-width="2.5"/><line x1="80" y1="260" x2="530" y2="260" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><g transform="rotate(-13.7 300 206)"><rect x="266" y="180" width="68" height="26" rx="0" fill="#fcf3cf" stroke="#222" stroke-width="2"/><rect x="282" y="166" width="36" height="15" rx="0" fill="#fcf3cf" stroke="#222" stroke-width="2"/></g><line x1="295" y1="185" x2="318" y2="92" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="328" y="88" fill="#2471a3" font-size="14" font-weight="bold">N</text><line x1="295" y1="185" x2="295" y2="265" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/><text x="303" y="271" fill="#c0392b" font-size="14" font-weight="bold">mg</text><line x1="295" y1="185" x2="318" y2="185" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/><text x="312" y="219" fill="#1e8449" text-anchor="middle" font-size="12">N sin θ</text><line x1="295" y1="185" x2="295" y2="92" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/><text x="281" y="110" fill="#1e8449" text-anchor="end" font-size="12">N cos θ</text><path d="M158 260A78 78 0 0 0 156 242" fill="none" stroke="#222" stroke-width="1.5"/><text x="168" y="246" fill="#222" font-size="14" font-weight="bold">θ</text><line x1="130" y1="120" x2="70" y2="120" stroke="#6c3483" stroke-width="2.5" marker-end="url(#p)"/><text x="136" y="124" fill="#6c3483" font-size="11">to the centre of the bend</text><text x="45" y="305" fill="#222" font-size="12">N cos θ = mg  and  N sin θ = mv²/r,  so  tan θ = v²/gr — the same equation as the conical pendulum.</text><text x="45" y="330" fill="#222" font-size="12" font-weight="bold">Design speed v = √(gr tan θ): the one speed needing no friction at all.</text></svg>