<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="640" height="350" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><circle cx="235" cy="170" r="108" fill="none" stroke="#777" stroke-width="1.6"/><circle cx="235" cy="170" r="5" fill="#222"/><circle cx="302" cy="85" r="7" fill="#2471a3"/><line x1="302" y1="85" x2="377" y2="144" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="373" y="164" fill="#2471a3" text-anchor="middle" font-size="13" font-weight="bold">v  (tangential)</text><line x1="302" y1="85" x2="235" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/><text x="252" y="121" fill="#c0392b" font-size="13" font-weight="bold">a<tspan dy="4" font-size="9">c</tspan><tspan dy="-4"> = v²/r</tspan></text><line x1="235" y1="170" x2="302" y2="85" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="279" y="120" fill="#777" font-size="12">r</text><text x="452" y="96" fill="#222" font-size="14" font-weight="bold">v = ωr</text><text x="452" y="126" fill="#222" font-size="14" font-weight="bold">a<tspan dy="4" font-size="10">c</tspan><tspan dy="-4"> = v²/r = ω²r</tspan></text><text x="452" y="156" fill="#222" font-size="14" font-weight="bold">F<tspan dy="4" font-size="10">c</tspan><tspan dy="-4"> = mv²/r</tspan></text><text x="452" y="192" fill="#777" font-size="13">ω = 2π/T = 2πf</text><text x="45" y="305" fill="#222" font-size="12">Velocity is always tangential; acceleration always points at the centre. They are perpendicular,</text><text x="45" y="326" fill="#222" font-size="12">which is why the speed can stay constant while the velocity changes.</text></svg>