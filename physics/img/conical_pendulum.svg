<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="600" height="370" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="180" y1="50" x2="420" y2="50" stroke="#222" stroke-width="3"/><line x1="300" y1="50" x2="300" y2="211" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="300" y1="50" x2="401" y2="211" stroke="#222" stroke-width="2.5"/><ellipse cx="300" cy="211.12913826972093" rx="101" ry="30" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="401" cy="211" r="14" fill="#d6eaf8" stroke="#222" stroke-width="2"/><line x1="401" y1="211" x2="401" y2="291" stroke="#c0392b" stroke-width="2.8" marker-end="url(#r)"/><text x="409" y="297" fill="#c0392b" font-size="14" font-weight="bold">mg</text><line x1="401" y1="211" x2="345" y2="122" stroke="#2471a3" stroke-width="2.8" marker-end="url(#b)"/><text x="337" y="114" fill="#2471a3" text-anchor="end" font-size="14" font-weight="bold">T</text><line x1="401" y1="211" x2="300" y2="211" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/><text x="350" y="201" fill="#1e8449" text-anchor="middle" font-size="12">T sin θ</text><line x1="401" y1="211" x2="401" y2="139" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/><text x="409" y="135" fill="#1e8449" font-size="12">T cos θ</text><path d="M300 102A52 52 0 0 0 328 94" fill="none" stroke="#222" stroke-width="1.5"/><text x="314" y="114" fill="#222" font-size="14">θ</text><text x="204" y="263" fill="#777" text-anchor="middle" font-size="12">r = L sin θ</text><text x="45" y="318" fill="#222" font-size="13">Vertically:  T cos θ = mg</text><text x="260" y="318" fill="#222" font-size="13">Horizontally:  T sin θ = mv²/r</text><text x="45" y="344" fill="#222" font-size="13" font-weight="bold">Dividing kills T and m:  tan θ = v²/gr.  T is always bigger than mg.</text></svg>