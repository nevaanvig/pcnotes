<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="620" height="350" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="90" y1="270" x2="545" y2="270" stroke="#222" stroke-width="2" marker-end="url(#k)"/><line x1="90" y1="270" x2="90" y2="50" stroke="#222" stroke-width="2" marker-end="url(#k)"/><text x="545" y="290" fill="#777" text-anchor="end" font-size="12">applied force / N</text><text x="84" y="44" fill="#777" font-size="12">friction / N</text><line x1="90" y1="270" x2="350" y2="120" stroke="#2471a3" stroke-width="3"/><line x1="350" y1="120" x2="350" y2="150" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/><line x1="350" y1="150" x2="520" y2="150" stroke="#c0392b" stroke-width="3"/><line x1="90" y1="120" x2="350" y2="120" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="350" y1="270" x2="350" y2="120" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/><text x="80" y="125" fill="#2471a3" text-anchor="end" font-size="14" font-weight="bold">μ<tspan dy="4" font-size="10">s</tspan><tspan dy="-4">N</tspan></text><text x="80" y="155" fill="#c0392b" text-anchor="end" font-size="14" font-weight="bold">μ<tspan dy="4" font-size="10">d</tspan><tspan dy="-4">N</tspan></text><text x="200" y="210" fill="#2471a3" font-size="12" font-weight="bold">static:  grows to match</text><text x="390" y="134" fill="#c0392b" font-size="12" font-weight="bold">kinetic: fixed at μ<tspan dy="4" font-size="8">d</tspan><tspan dy="-4">N</tspan></text><text x="350" y="290" fill="#777" text-anchor="middle" font-size="11">it breaks away here</text><text x="45" y="322" fill="#222" font-size="12">Static friction supplies only what is needed, up to a ceiling. Past it, friction DROPS, because μ<tspan dy="4" font-size="8">d</tspan><tspan dy="-4"> &lt; μ</tspan><tspan dy="4" font-size="8">s</tspan><tspan dy="-4">.</tspan></text></svg>