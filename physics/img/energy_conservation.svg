161" fill="#222" font-size="12">potential</text><text x="50" y="340" fill="#222" font-size="13" font-weight="bold">Energy is never created or destroyed — only moved between stores.</text><text x="50" y="364" fill="#222" font-size="12.5">mgh at the top  =  ½mv² at the bottom, so v = √(2gh) and the mass cancels.</text></svg>