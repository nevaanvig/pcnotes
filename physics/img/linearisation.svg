<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="680" height="380" fill="#fff"/><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c3483"/></marker></defs><line x1="70" y1="250" x2="300" y2="250" stroke="#222" stroke-width="2" marker-end="url(#k)"/><line x1="70" y1="250" x2="70" y2="60" stroke="#222" stroke-width="2" marker-end="url(#k)"/><text x="300" y="270" fill="#777" text-anchor="end" font-size="12">x</text><text x="64" y="54" fill="#777" font-size="12">y</text><polyline points="70,250 72,250 75,250 77,250 79,250 82,249 84,249 86,249 88,249 91,248 93,248 95,247 98,247 100,246 102,246 104,245 107,245 109,244 111,243 114,242 116,242 118,241 121,240 123,239 125,238 128,237 130,236 132,235 134,233 137,232 139,231 141,230 144,228 146,227 148,226 150,224 153,223 155,221 157,219 160,218 162,216 164,214 167,213 169,211 171,209 174,207 176,205 178,203 180,201 183,199 185,197 187,195 190,193 192,191 194,188 196,186 199,184 201,181 203,179 206,176 208,174 210,171 213,169 215,166 217,163 220,161 222,158 224,155 226,152 229,149 231,146 233,143 236,140 238,137 240,134 242,131 245,128 247,125 249,121 252,118 254,115 256,111 259,108 261,104 263,101 266,97 268,94 270,90 272,86 275,82 277,79 279,75 282,71 284,67 286,63 288,59 291,55 293,51 295,47 298,43 300,38" fill="none" stroke="#2471a3" stroke-width="3"/><text x="180" y="98" fill="#2471a3" text-anchor="middle" font-size="14" font-weight="bold">y = k x^n</text><text x="185" y="294" fill="#777" text-anchor="middle" font-size="11">curved — hard to judge by eye</text><line x1="390" y1="250" x2="620" y2="250" stroke="#222" stroke-width="2" marker-end="url(#k)"/><line x1="390" y1="250" x2="390" y2="60" stroke="#222" stroke-width="2" marker-end="url(#k)"/><text x="620" y="270" fill="#777" text-anchor="end" font-size="12">log x</text><text x="384" y="54" fill="#777" font-size="12">log y</text><line x1="406" y1="220" x2="595" y2="80" stroke="#c0392b" stroke-width="3"/><text x="510" y="100" fill="#c0392b" text-anchor="middle" font-size="13" font-weight="bold">gradient = n</text><text x="406" y="226" fill="#c0392b" font-size="11">intercept = log k</text><text x="505" y="294" fill="#777" text-anchor="middle" font-size="11">straight — gradient reads off n</text><path d="M318 160 L372 160" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/><text x="345" y="150" fill="#777" text-anchor="middle" font-size="11">log–log</text><text x="45" y="330" fill="#222" font-size="12">A straight line is the only graph the eye can judge. Take logs of both sides: log y = n log x + log k.</text><text x="45" y="356" fill="#222" font-size="12">For y = ke<tspan dy="-6" font-size="8">ax</tspan><tspan dy="6"> plot ln y against x instead — gradient a, intercept ln k.</tspan></text></svg>