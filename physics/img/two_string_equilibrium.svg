<text x="390" y="102" fill="#1e8449" font-size="14" font-weight="bold">T</text><path d="M240 150A60 60 0 0 1 261 104" fill="none" stroke="#222" stroke-width="1.5"/><text x="228" y="134" fill="#2471a3" text-anchor="end" font-size="12">50°</text><path d="M352 120A60 60 0 0 1 360 150" fill="none" stroke="#222" stroke-width="1.5"/><text x="370" y="136" fill="#1e8449" font-size="12">30°</text><line x1="180" y1="150" x2="420" y2="150" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/><text x="45" y="300" fill="#222" font-size="13">Horizontally:  S cos 50° = T cos 30°</text><text x="45" y="324" fill="#222" font-size="13">Vertically:    S sin 50° + T sin 30° = mg        The shallower string always carries more.</text></svg>