<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="900" height="380" fill="#fff"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2471a3"/></marker></defs><text x="20" y="48" fill="#222" font-size="13" font-weight="bold">Elastic</text><text x="20" y="66" fill="#777" font-size="11">p conserved, KE conserved</text><text x="300" y="40" fill="#777" text-anchor="middle" font-size="10">before</text><text x="560" y="40" fill="#777" text-anchor="middle" font-size="10">after</text><circle cx="300" cy="80" r="22" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="366" cy="80" r="22" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="250" y1="80" x2="290" y2="80" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="246" y="85" fill="#2471a3" text-anchor="end" font-size="14">u</text><circle cx="520" cy="80" r="22" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="612" cy="80" r="22" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="496" y1="80" x2="462" y2="80" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><line x1="636" y1="80" x2="690" y2="80" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="700" y="85" fill="#777" font-size="11">KE unchanged</text><text x="20" y="158" fill="#222" font-size="13" font-weight="bold">Inelastic (sticking)</text><text x="20" y="176" fill="#777" font-size="11">p conserved, KE lost to heat and sound</text><text x="300" y="150" fill="#777" text-anchor="middle" font-size="10">before</text><text x="560" y="150" fill="#777" text-anchor="middle" font-size="10">after</text><circle cx="300" cy="190" r="22" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="366" cy="190" r="22" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="250" y1="190" x2="290" y2="190" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="246" y="195" fill="#2471a3" text-anchor="end" font-size="14">u</text><circle cx="540" cy="190" r="22" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="582" cy="190" r="22" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="606" y1="190" x2="680" y2="190" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="690" y="195" fill="#777" font-size="11">one object, speed v</text><text x="20" y="268" fill="#222" font-size="13" font-weight="bold">Explosion</text><text x="20" y="286" fill="#777" font-size="11">p conserved, KE gained from stored energy</text><text x="300" y="260" fill="#777" text-anchor="middle" font-size="10">before</text><text x="560" y="260" fill="#777" text-anchor="middle" font-size="10">after</text><circle cx="300" cy="300" r="26" fill="#e8daef" stroke="#222" stroke-width="2"/><text x="300" y="304" fill="#222" text-anchor="middle" font-size="10">at rest</text><circle cx="540" cy="300" r="20" fill="#d6eaf8" stroke="#222" stroke-width="2"/><circle cx="620" cy="300" r="14" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="516" y1="300" x2="452" y2="300" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><line x1="638" y1="300" x2="700" y2="300" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/><text x="710" y="305" fill="#777" font-size="11">equal and opposite p</text><text x="20" y="350" fill="#222" font-size="12" font-weight="bold">Momentum is conserved in every case (no external force). Kinetic energy is the thing that distinguishes them.</text><text x="20" y="370" fill="#777" font-size="11">Perfectly inelastic = maximum possible KE loss consistent with conserving momentum.</text></svg>