<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica,Arial,sans-serif" font-size="14"><rect width="680" height="330" fill="#fff"/><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d68910"/></marker></defs><circle cx="150" cy="120" r="26" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="150" y1="146" x2="150" y2="210" stroke="#222" stroke-width="3"/><line x1="150" y1="170" x2="70" y2="150" stroke="#222" stroke-width="3"/><line x1="150" y1="170" x2="230" y2="150" stroke="#222" stroke-width="3"/><line x1="150" y1="210" x2="132" y2="260" stroke="#222" stroke-width="3"/><line x1="150" y1="210" x2="168" y2="260" stroke="#222" stroke-width="3"/><line x1="110" y1="262" x2="190" y2="262" stroke="#777" stroke-width="2"/><path d="M210 95A60 60 0 0 0 90 95" fill="none" stroke="#d68910" stroke-width="2.5" marker-end="url(#o)"/><text x="150" y="82" fill="#d68910" text-anchor="middle" font-size="14" font-weight="bold">ω</text><text x="150" y="296" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">Arms out: large I, small ω</text><circle cx="400" cy="120" r="26" fill="#fdebd0" stroke="#222" stroke-width="2"/><line x1="400" y1="146" x2="400" y2="210" stroke="#222" stroke-width="3"/><line x1="400" y1="170" x2="378" y2="164" stroke="#222" stroke-width="3"/><line x1="400" y1="170" x2="422" y2="164" stroke="#222" stroke-width="3"/><line x1="400" y1="210" x2="382" y2="260" stroke="#222" stroke-width="3"/><line x1="400" y1="210" x2="418" y2="260" stroke="#222" stroke-width="3"/><line x1="360" y1="262" x2="440" y2="262" stroke="#777" stroke-width="2"/><path d="M460 95A60 60 0 0 0 340 95" fill="none" stroke="#d68910" stroke-width="2.5" marker-end="url(#o)"/><text x="400" y="82" fill="#d68910" text-anchor="middle" font-size="14" font-weight="bold">ω (faster)</text><text x="400" y="296" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">Arms in: small I, large ω</text><text x="530" y="140" fill="#777" font-size="12">No external torque, so</text><text x="530" y="160" fill="#222" font-size="13" font-weight="bold">L = Iω is conserved:</text><text x="530" y="186" fill="#6c3483" font-size="14" font-weight="bold">I<tspan dy="4" font-size="10">1</tspan><tspan dy="-4">ω</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> = I</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4">ω</tspan><tspan dy="4" font-size="10">2</tspan></text><text x="530" y="216" fill="#222" font-size="12">KE<tspan dy="4" font-size="8">rot</tspan><tspan dy="-4"> = ½Iω² = L²/2I</tspan></text><text x="530" y="236" fill="#777" font-size="11">rises as I falls — the</text><text x="530" y="252" fill="#777" font-size="11">skater does work pulling in.</text></svg>